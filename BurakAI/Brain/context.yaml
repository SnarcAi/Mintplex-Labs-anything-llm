# ═══════════════════════════════════════════════════════
# TEMPORAL CONTEXT (Zamansal bağlam)
# ═══════════════════════════════════════════════════════
temporal:
  # Week/month awareness
  calendar:
    Q4_closing: true  # Q4 kapanışı stresli
    month_end: false  # Ay sonu ekstra yoğun
    week_status: "normal"  # yoğun, normal, sakin

  # Time-based behavior adjustments
  time_rules:
    "06:00-09:00":
      mode: "planlama"
      style: "özet_odaklı"
      note: "Sabah - günlük hazırlık"

    "09:00-12:00":
      mode: "üretken"
      style: "detaylı_derin"
      note: "En üretken saatler"

    "14:00-18:00":
      mode: "operasyonel"
      style: "hızlı_aksiyonel"
      note: "Müşteri iletişimi, kararlar"

    "18:00+":
      mode: "analitik"
      style: "rapor_özet"
      note: "Gün sonu değerlendirme"

    "friday_16:00+":
      mode: "karar"
      style: "özet_aksiyon"
      note: "Haftalık değerlendirme + hafta sonu kararları"

