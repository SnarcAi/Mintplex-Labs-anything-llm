  _template:
    name: "string"
    category: "string"
    un_number: null  # ADR için
    hazard_class: null
    typical_margin_percent: 0
    cost_per_unit_try: 0
    typical_price_try: 0
    min_order_quantity: 1
    compliance_notes: ""

  # Real products (örnekler)
  bioethanol_5L:
    name: "Bioethanol 5L"
    category: "kimyasal"
    un_number: "UN1170"
    hazard_class: "3"
    typical_margin_percent: 28
    cost_per_unit_try: 118
    typical_price_try: 164
    min_order_quantity: 100
