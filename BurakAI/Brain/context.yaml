    risk_score: 5  # 1-10 (10 = en riskli)
    payment_avg_days: 30
    payment_reliability: 8  # 1-10 (10 = her zaman zamanında)
    lifetime_value_try: 0
    past_issues: 0
    notes: ""
    last_interaction: "2025-01-01"
    preferred_payment_method: "transfer"
    requires_deposit: false

  # Real customers (örnekler - gerçek verilerle değiştir)
  ABC_Lojistik:
    name: "ABC Lojistik A.Ş."
    risk_score: 7
    payment_avg_days: 45
    payment_reliability: 6
    lifetime_value_try: 250000
    past_issues: 2
    notes: "Geçmişte ödeme gecikmeleri. Büyük sipariş → kaparo iste."
    last_interaction: "2025-10-25"
    preferred_payment_method: "transfer"
    requires_deposit: true  # Risk yüksek

  Zeeman_TR:
    name: "Zeeman Türkiye"
    risk_score: 3
    payment_avg_days: 30
    payment_reliability: 9
    lifetime_value_try: 500000
    past_issues: 0
    notes: "Güvenilir. Sıkı compliance gereksinimleri."
    last_interaction: "2025-10-28"
    preferred_payment_method: "transfer"
    requires_deposit: false

  XYZ_Kimya:
    name: "XYZ Kimya San. Tic."
    risk_score: 8
    payment_avg_days: 60
    payment_reliability: 5
    lifetime_value_try: 180000
    past_issues: 3
    notes: "ÇOK RİSKLİ. Sadece %30 peşinat ile çalış. ADR sorunları geçmişte."
    last_interaction: "2025-09-15"
    preferred_payment_method: "çek"  # Riskli
    requires_deposit: true

# ═══════════════════════════════════════════════════════
# PRODUCTS (Ürün profilleri)
# ═══════════════════════════════════════════════════════
products:
