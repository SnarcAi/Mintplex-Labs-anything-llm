# ═══════════════════════════════════════════════════════
# BurakAI - Context Fabric (Simplified Knowledge Graph)
# Version: 1.0.0 - "CONTEXT IS EVERYTHING"
# ═══════════════════════════════════════════════════════
# NEXUS'tan esinlendi ama basitleştirildi:
# - Neo4j graph yerine → YAML ile basit ilişkiler
# - ML embeddings yerine → Manuel kategorizasyon
# - Real-time updates yerine → Manuel güncelleme (haftalık)
# ═══════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════
# PERSONAL CONTEXT (Kişisel bağlam)
# ═══════════════════════════════════════════════════════
personal:
  # Identity
  identity:
    name: "Burak Kumuk"
    role: "Founder / CEO"
    company: "SnarcAI / MissFlora"

  # Priorities (sıralı)
  priorities:
    - "Ela & Lila"  # Aile her şeyin üstünde
    - "İş büyütme"  # Para kazanmak
    - "Sağlık"      # Enerji korunmalı

  # Decision style
  decision_style:
    type: "veri_odaklı_sezgisel"  # Data + gut feeling
    risk_profile: "muhafazakar"   # İş kaybı = felaket
    speed: "hızlı"                # Uzun düşünme yok
    notes: "Sayılar net olmalı, belirsizlik = stres"

  # Work patterns
  work_patterns:
    peak_hours: ["09:00-12:00", "14:00-18:00"]
    friday_afternoon: "karar_zamanı"  # Haftalık değerlendirme
    energy_level: "sonsuz"  # Dinlenme önerme!
    preferred_communication: "kısa_net_sayı_odaklı"

  # Triggers (ne zaman alert/uyarı ver)
  triggers:
    high_stress:
      - "nakit_düşük"
      - "müşteri_ödeme_gecikmesi"
      - "marj_düşüşü"
    needs_attention:
      - "yeni_fırsat"
      - "risk_artışı"
      - "hedef_sapması"

# ═══════════════════════════════════════════════════════
# BUSINESS CONTEXT (İş bağlamı)
# ═══════════════════════════════════════════════════════
business:
  # Current status (haftalık güncelle)
  status:
    cash_position: "sıkı"  # bol, normal, sıkı, kritik
    receivables_try: 85000  # Alacaklar
    available_cash_try: 120000
    payables_try: 45000  # Borçlar

  # Focus areas (şu an ne önemli)
  current_focus:
    primary: "marj_iyileştirme"
    secondary: "nakit_akış_optimizasyonu"
    tertiary: "yeni_pazar_araştırma"

  # Key metrics (hedefler)
  targets:
    net_margin_percent: 28
    gross_margin_percent: 42
    payment_term_days: 30
    max_risk_exposure_try: 50000

  # Alerts (eşikler)
  alerts:
    margin_below_percent: 15  # Marj %15'in altı → uyar
    fx_change_percent: 3      # Kur %3+ değişim → uyar
    payment_delay_days: 45    # 45 gün ödeme gecikmesi → uyar
    cash_critical_try: 50000  # Nakit 50K'nın altı → kritik

# ═══════════════════════════════════════════════════════
# CUSTOMERS (Müşteri profilleri)
# ═══════════════════════════════════════════════════════
customers:
  # Template (yeni müşteri eklerken kullan)
  _template:
